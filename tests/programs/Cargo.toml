[package]
name = "backstop-tests"
version = "0.1.0"
description = "LiteSVM integration tests for the BACKSTOP program suite (requires `anchor build` first)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "backstop_tests"
path = "src/lib.rs"

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
litesvm = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
backstop-common = { workspace = true }
backstop-math = { workspace = true }
backstop-hook = { path = "../../programs/transfer-hook", features = ["no-entrypoint"] }
backstop-core = { path = "../../programs/backstop-core", features = ["no-entrypoint"] }
backstop-amm = { path = "../../programs/backstop-amm", features = ["no-entrypoint"] }
backstop-offers = { path = "../../programs/backstop-offers", features = ["no-entrypoint"] }
backstop-chest = { path = "../../programs/backstop-chest", features = ["no-entrypoint"] }
mock-lending = { path = "../../programs/mock-lending", features = ["no-entrypoint"] }
backstop-launchpad = { path = "../../programs/backstop-launchpad", features = ["no-entrypoint"] }
solana-account = "4"
mock-swap = { path = "../../programs/mock-swap", features = ["no-entrypoint"] }
