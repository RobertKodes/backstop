[package]
name = "backstop-amm"
version = "0.1.0"
description = "BACKSTOP constant-product AMM with protocol-owned liquidity, fee routing to core and an on-chain TWAP oracle."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "backstop_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "backstop-core/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
backstop-math = { workspace = true }
backstop-common = { workspace = true }
backstop-core = { path = "../backstop-core", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
